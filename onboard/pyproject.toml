[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wingman-onboard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]
# also needs wingman-ground and wingman-vlm installed (pip install -e each)

[tool.setuptools.packages.find]
where = ["src"]
